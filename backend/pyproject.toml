[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nikof-backend"
version = "0.1.0"
description = "Backend scaffold for the NikoF local companion stack."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"fastapi>=0.115,<1.0",
	"uvicorn>=0.34,<1.0",
	"websockets>=12,<16",
	"faster-whisper>=1.1,<2.0",
	"numpy>=1.26,<3.0",
	"psutil>=5.9,<7.0",
	"sounddevice>=0.4.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
