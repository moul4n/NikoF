[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nikof-backend"
version = "0.1.0"
description = "Backend scaffold for the NikoF local companion stack."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"fastapi>=0.115,<1.0",
	"uvicorn>=0.34,<1.0",
	"websockets>=12,<16",
	"faster-whisper>=1.1,<2.0",
	"numpy>=1.26,<3.0",
	"psutil>=5.9,<7.0",
	"sounddevice>=0.4.6,<1.0",
]

[project.optional-dependencies]
# Pluggable TTS engines (Phase 3/4), selected via NIKOF_TTS_ENGINE.
# Kokoro: fast, CPU-friendly, 24kHz, preset voice (no cloning).
kokoro = ["kokoro-onnx>=0.5,<1.0"]
# XTTS-v2 (voice cloning). coqui-tts treats torch as a user prerequisite and,
# on torch>=2.9, additionally requires torchcodec (needs system FFmpeg) — so pin
# torch<2.9. coqui-tts 0.27 needs transformers 4.57.x. Runtime also needs
# COQUI_TOS_AGREED=1 and a reference WAV at <tts_models_root>/xtts/reference.wav.
xtts = [
	"coqui-tts>=0.27,<0.28",
	"torch>=2.6,<2.9",
	"torchaudio>=2.6,<2.9",
	"transformers>=4.57,<4.58",
]
# Streaming STT (Phase 3), selected via NIKOF_STT_ENGINE=parakeet. NVIDIA
# Parakeet TDT 0.6B v2 via onnx-asr on onnxruntime-gpu (CUDA EP), in-process
# like Kokoro — no NeMo/torch. onnxruntime-gpu replaces the CPU onnxruntime
# wheel (it still ships CPUExecutionProvider, so Kokoro keeps working). Model
# files live at <stt_models_root>/parakeet-tdt-0.6b-v2 (acquired locally, not
# committed).
#
# onnxruntime-gpu is pinned to the CUDA-12 / cuDNN-9 build line (<1.23); 1.23+
# moved to CUDA 13, which this box (CUDA 12.8 via torch cu128) lacks. The CUDA
# runtime DLLs (cublasLt64_12, cudnn64_9) are not bundled — they come from the
# torch cu12 build already present, or the nvidia-*-cu12 wheels; the engine adds
# their lib dir to the DLL search path at load. Verified on GPU: ~70 ms / 2.3 s
# clip (RTF ~0.03) vs ~600 ms on CPU fallback.
parakeet = [
	"onnx-asr>=0.11,<1.0",
	"onnxruntime-gpu>=1.20,<1.23",
]

[tool.setuptools.packages.find]
include = ["app*"]
